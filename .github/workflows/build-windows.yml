name: Build BankSaathi Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Build portable EXE
        run: npm run build
      - name: Verify EXE exists
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist -Filter *.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "No EXE was produced." }
          Write-Host "Built $($exe.FullName)"
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: BankSaathi-Windows-EXE
          path: windows-app/dist/*.exe
          if-no-files-found: error
          retention-days: 14
